<style>
/* Layout: 한 줄 기둥 — 입장(이모지 암호) → 이름 고르기 → 날짜 바 / 내 도장판 / 친구들 */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18212C; --muted:#5E6B78; --line:#D5DCE3;
  --stamp:#C2364B; --stamp-soft:#F6DCE0; --ok:#2F7D5B;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171D; --surface:#1B222B; --ink:#E6EBF0; --muted:#94A1AE; --line:#2C3743;
  --stamp:#F0647A; --stamp-soft:#3A2128; --ok:#5CC495; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:34px;letter-spacing:.5px}
h2{font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:6px}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.notice{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* 입장 화면 */
.gate{min-height:80vh;justify-content:center}
.slots{display:flex;gap:10px}
.slot{width:56px;height:56px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:26px}
.slot.on{border:2px solid var(--stamp);background:var(--stamp-soft);transform:rotate(-8deg)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px}
.key{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;font-size:34px}
.key:active{transform:scale(.94)}
.key.wrong{border-color:var(--stamp);animation:shake .35s}
.key.right{border:2px solid var(--stamp);background:var(--stamp-soft);transform:rotate(-8deg)}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
.gmsg{min-height:1.5em;font-size:14px;color:var(--stamp)}
.hint{font-size:12px;color:var(--muted)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
form.row-form{display:flex;gap:8px;flex-wrap:wrap}
form.row-form input{flex:1;min-width:0}

/* 메인 */
header{display:flex;flex-direction:column;gap:12px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.roomtag{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebar .label{font-family:var(--f-mono);font-size:15px;min-width:7.5em;text-align:center}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.stampbtn{width:44px;height:44px;border-radius:50%;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;font-size:20px;transition:transform .15s}
.stampbtn.on{border:2px solid var(--stamp);background:var(--stamp-soft);transform:rotate(-8deg)}
.hname{font-weight:500;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.week{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--stamp)}
.dot.sel{outline:1.5px solid var(--ink);outline-offset:1px}
.streak{font-family:var(--f-mono)}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:6px}
.del.armed{color:var(--stamp);font-weight:700}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
#emoji{width:3.2em;text-align:center;flex:none}
.friends{display:grid;gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fhead{display:flex;align-items:center;gap:10px}
.fhead .who{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.prog{font-family:var(--f-mono);font-size:13px}
.prog.full{color:var(--ok)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--stamp)}
.flist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.fitem{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center}
.fitem.done .fn{text-decoration:line-through;text-decoration-color:var(--stamp);text-decoration-thickness:2px}
.weekhead{display:flex;gap:3px;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.weekhead span{width:9px;text-align:center}
@media (prefers-reduced-motion:reduce){.stampbtn,.key{transition:none;animation:none}}
</style>

<body>

<!-- 1. 입장: 이모지 암호 -->
<div class="wrap gate" id="v-gate" hidden>
  <div>
    <div class="eyebrow">함께 쓰는 습관 기록</div>
    <h1>습관 도장판</h1>
  </div>
  <p class="sub">입장 암호를 골라 주세요.</p>
  <div class="keypad" id="keypad"></div>
  <div class="gmsg" id="g-msg" role="status" aria-live="polite"></div>
  <div class="hint">홈 화면에 추가하면 다음에도 편하게 올 수 있어요. (Safari 공유 버튼 → 홈 화면에 추가)</div>
  <div class="notice" id="demo-note" hidden>체험 모드예요. Firebase 설정을 넣기 전까지는 기록이 이 기기에만 저장되고 친구와 공유되지 않아요.</div>
</div>

<!-- 2. 이름 고르기 -->
<div class="wrap gate" id="v-who" hidden>
  <div>
    <div class="eyebrow" id="who-room"></div>
    <h1>누구세요?</h1>
  </div>
  <p class="sub" id="who-sub"></p>
  <div class="people" id="who-list"></div>
  <form class="row-form" id="who-form">
    <input id="who-name" maxlength="16" placeholder="새 이름 (예: 다은)" aria-label="이름">
    <button class="btn primary" type="submit">이 이름으로 시작</button>
  </form>
  <button class="btn ghost" id="who-back" style="align-self:flex-start">← 다른 암호로</button>
</div>

<!-- 3. 메인 -->
<div class="wrap" id="v-main" hidden>
  <header>
    <div class="topline">
      <div class="roomtag"><span id="m-room"></span><span>·</span><span id="m-me"></span></div>
      <div><button class="btn ghost" id="switch-me">이름 바꾸기</button><button class="btn ghost" id="leave">방 나가기</button></div>
    </div>
    <h1>습관 도장판</h1>
    <div class="datebar">
      <button class="btn" id="prev" aria-label="이전 날">◀</button>
      <span class="label" id="dlabel"></span>
      <button class="btn" id="next" aria-label="다음 날">▶</button>
      <button class="btn" id="today">오늘</button>
    </div>
    <div class="notice" id="notice" hidden></div>
  </header>

  <section>
    <div class="sechead"><h2>내 습관</h2><span class="count" id="mycount"></span></div>
    <div class="sheet" id="mylist"></div>
    <form class="row-form" id="addform">
      <input id="emoji" maxlength="4" value="💧" aria-label="이모지">
      <input id="hname" maxlength="40" placeholder="새 습관 (예: 물 2L 마시기)" aria-label="습관 이름">
      <button class="btn primary" type="submit">추가</button>
    </form>
  </section>

  <section>
    <div class="sechead"><h2>친구들</h2><span class="count" id="fcount"></span></div>
    <div class="friends" id="friends"></div>
  </section>
</div>

<script>
/* ---------- 기본 ---------- */
const KEYS = ["🍓","🍙","🍩","🍊","🌰","🍪","🍠","🍞","🍒"];
// 정답 이모지의 해시값 (정답 자체는 코드에 적지 않아요). 앞: 일반, 뒤: 보안 연결이 아닐 때 대체값
const ANSWER_HASHES = ["339a61f06d66ddbdeeec5dee8baa9696","5654590920f7876b"];
const DOW = ["일","월","화","수","목","금","토"];
const COLORS = ["#C2364B","#2F7D5B","#3B63B8","#B8742A","#7A4FB5","#1F8A93","#A3456F","#5B6B2E"];
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => key(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
};
function show(id){ for(const v of ["v-gate","v-who","v-main"]) $("#"+v).hidden = v!==id; window.scrollTo(0,0); }
function notice(msg){ const n=$("#notice"); n.textContent=msg||""; n.hidden=!msg; }

async function hashCode(code){
  const salt = "habit-stamp-v1:";
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+code));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32);
  }catch(e){ // 보안 컨텍스트가 아닐 때(파일로 직접 연 경우 등) 대체
    let h1=0x811c9dc5, h2=0x1234567;
    for(const ch of salt+code){ const c=ch.codePointAt(0); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; }
    return h1.toString(16)+h2.toString(16);
  }
}

/* ---------- 저장소: Firebase 또는 체험 모드 ---------- */
const hasFirebase = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL && window.firebase);
let fdb = null;
if(hasFirebase){ firebase.initializeApp(firebaseConfig); fdb = firebase.database(); }

function makeStore(roomHash){
  if(fdb){
    const base = fdb.ref("rooms/"+roomHash+"/members");
    return {
      listen(cb, onErr){ const h = s => cb(s.val()||{}); base.on("value", h, onErr); return () => base.off("value", h); },
      set(path, val){ return base.child(path).set(val); },
      update(obj){ return base.update(obj); }
    };
  }
  // 체험 모드: localStorage
  const K = "ht.demo."+roomHash; let subs=[];
  const read = () => { try{ return JSON.parse(ls.get(K)||"{}"); }catch(e){ return {}; } };
  const write = d => { ls.set(K, JSON.stringify(d)); subs.forEach(f=>f(d)); };
  const setPath = (obj, path, val) => {
    const parts = path.split("/"); let o=obj;
    for(let i=0;i<parts.length-1;i++){ o[parts[i]] = o[parts[i]] && typeof o[parts[i]]==="object" ? o[parts[i]] : {}; o=o[parts[i]]; }
    if(val==null) delete o[parts.at(-1)]; else o[parts.at(-1)] = val;
  };
  return {
    listen(cb){ subs.push(cb); cb(read()); return () => { subs=subs.filter(f=>f!==cb); }; },
    set(path,val){ const d=read(); setPath(d,path,val); write(d); return Promise.resolve(); },
    update(obj){ const d=read(); for(const [p,v] of Object.entries(obj)) setPath(d,p,v); write(d); return Promise.resolve(); }
  };
}

/* ---------- 상태 ---------- */
let roomCode = null;
let roomHash = null;
let store = null, unlisten = null;
let members = {};          // id -> {name, color, habits:{}, checks:{}}
let me = null;             // 내 member id
let sel = new Date(); sel.setHours(0,0,0,0);
let armed = null;

const habitsOf = m => Object.entries((m&&m.habits)||{}).map(([id,h])=>({id,...h})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const doneOn = (m,k) => Object.keys(((m&&m.checks)||{})[k]||{});
const colorOf = m => (m&&m.color) || COLORS[0];

/* ---------- 1. 입장 ---------- */
function renderGate(){
  $("#g-msg").textContent = "";
  document.querySelectorAll(".key").forEach(k=>k.classList.remove("wrong","right"));
}
let checking = false;
KEYS.forEach(k=>{
  const b=el("button","key",k); b.setAttribute("aria-label","암호 "+k);
  b.onclick = async () => {
    if(checking) return; checking = true;
    document.querySelectorAll(".key").forEach(x=>x.classList.remove("wrong"));
    const h = await hashCode(k);
    if(ANSWER_HASHES.includes(h)){
      b.classList.add("right"); $("#g-msg").textContent = "";
      await new Promise(r=>setTimeout(r,300));
      checking = false; enterRoom();
    }else{
      void b.offsetWidth; b.classList.add("wrong");
      $("#g-msg").textContent = "암호가 아니에요. 다시 골라 주세요.";
      checking = false;
    }
  };
  $("#keypad").append(b);
});
$("#demo-note").hidden = hasFirebase;

async function enterRoom(){
  roomCode = "도장판"; roomHash = ANSWER_HASHES[0];
  ls.set("ht.room", "ok");
  if(unlisten) unlisten();
  store = makeStore(roomHash);
  me = ls.get("ht.me."+roomHash);
  let first = true;
  unlisten = store.listen(data => {
    members = data || {};
    if(first){
      first = false;
      if(me && members[me]) startMain(); else { me=null; showWho(); }
      return;
    }
    if(!$("#v-who").hidden) renderWho();
    if(!$("#v-main").hidden) render();
  }, err => { notice("서버와 연결이 끊겼어요. Firebase 규칙과 주소를 확인해 주세요. ("+err.code+")"); });
}

/* ---------- 2. 이름 ---------- */
function showWho(){ show("v-who"); renderWho(); setTimeout(()=>$("#who-name").focus(),50); }
function renderWho(){
  $("#who-room").textContent = "습관 도장판";
  const list = Object.entries(members);
  $("#who-sub").textContent = list.length ? "이미 들어온 친구들이에요. 내 이름을 누르거나 새로 만들어 주세요." : "아직 아무도 없어요. 첫 번째로 이름을 만들어 주세요.";
  const box=$("#who-list"); box.replaceChildren();
  for(const [id,m] of list){
    const b=el("button","chip");
    const av=el("span","av",(m.name||"?").slice(0,1)); av.style.background=colorOf(m);
    b.append(av, el("span",null,m.name||"이름 없음"));
    b.onclick = () => { me=id; ls.set("ht.me."+roomHash, id); startMain(); };
    box.append(b);
  }
}
$("#who-form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#who-name").value.trim(); if(!name) return;
  const taken = Object.entries(members).find(([,m])=>m.name===name);
  if(taken){ me=taken[0]; }
  else{
    me = uid();
    const used = new Set(Object.values(members).map(m=>m.color));
    const color = COLORS.find(c=>!used.has(c)) || COLORS[Object.keys(members).length % COLORS.length];
    try{ await store.set(me, {name, color, joinedAt: Date.now()}); }
    catch(err){ alert("방에 들어가지 못했어요: "+err.message); return; }
  }
  ls.set("ht.me."+roomHash, me); $("#who-name").value=""; startMain();
});
$("#who-back").onclick = leave;

/* ---------- 3. 메인 ---------- */
function startMain(){ show("v-main"); notice(hasFirebase ? "" : "체험 모드예요. 기록이 이 기기에만 저장돼요."); render(); }
function leave(){
  if(unlisten) unlisten(); unlisten=null;
  ls.set("ht.room", null); roomCode=null; me=null; members={};
  show("v-gate"); renderGate();
}
$("#leave").onclick = leave;
$("#switch-me").onclick = () => { ls.set("ht.me."+roomHash, null); me=null; showWho(); };

const write = (p, v) => store.set(p, v).catch(err => notice("저장하지 못했어요: "+err.message));

function toggle(hid){
  const k=key(sel); if(k>todayKey()) return;
  const on = doneOn(members[me],k).includes(hid);
  write(`${me}/checks/${k}/${hid}`, on ? null : true);
}
function removeHabit(hid){
  const upd = {[`${me}/habits/${hid}`]: null};
  for(const [k,day] of Object.entries(members[me].checks||{})) if(day[hid]) upd[`${me}/checks/${k}/${hid}`]=null;
  armed=null;
  store.update(upd).catch(err=>notice("삭제하지 못했어요: "+err.message));
}
$("#addform").addEventListener("submit", e => {
  e.preventDefault();
  const name=$("#hname").value.trim(); if(!name) return;
  const emoji=$("#emoji").value.trim()||"✔";
  write(`${me}/habits/${uid()}`, {name, emoji, createdAt: Date.now()});
  $("#hname").value="";
});
$("#prev").onclick = () => { sel=addDays(sel,-1); render(); };
$("#next").onclick = () => { if(key(sel)<todayKey()){ sel=addDays(sel,1); render(); } };
$("#today").onclick = () => { sel=new Date(); sel.setHours(0,0,0,0); render(); };

function streak(m, hid){
  let d=new Date(); d.setHours(0,0,0,0);
  if(!doneOn(m,key(d)).includes(hid)) d=addDays(d,-1);
  let n=0; while(doneOn(m,key(d)).includes(hid)){ n++; d=addDays(d,-1); }
  return n;
}
function weekDots(m, hid){
  const w=el("div","week");
  for(let i=6;i>=0;i--){
    const d=addDays(sel,-i), dot=el("span","dot"+(doneOn(m,key(d)).includes(hid)?" on":"")+(i===0?" sel":""));
    dot.title=`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; w.append(dot);
  }
  return w;
}
function weekHead(){ const h=el("div","weekhead"); for(let i=6;i>=0;i--) h.append(el("span",null,DOW[addDays(sel,-i).getDay()])); return h; }

function render(){
  const mine = members[me];
  if(!mine){ showWho(); return; }   // 내 정보가 지워졌으면 다시 고르기
  const k=key(sel), isToday=k===todayKey();
  $("#m-room").textContent = "🍀 함께하는 중";
  $("#m-me").textContent = mine.name;
  $("#dlabel").textContent = `${sel.getMonth()+1}월 ${sel.getDate()}일 (${DOW[sel.getDay()]})`;
  $("#today").disabled = isToday;
  $("#next").disabled = isToday;

  const hs=habitsOf(mine), done=doneOn(mine,k);
  $("#mycount").textContent = hs.length ? `${hs.filter(h=>done.includes(h.id)).length} / ${hs.length} 완료` : "";
  const list=$("#mylist"); list.replaceChildren();
  if(!hs.length) list.append(el("div","empty","아직 습관이 없어요. 아래에서 첫 습관을 추가해 보세요."));
  for(const h of hs){
    const on=done.includes(h.id), row=el("div","row");
    const b=el("button","stampbtn"+(on?" on":""), on?h.emoji:"");
    b.setAttribute("aria-pressed",on); b.setAttribute("aria-label",`${h.name} ${on?"완료 취소":"완료"}`);
    b.onclick=()=>toggle(h.id);
    const mid=el("div"); mid.style.minWidth="0";
    const meta=el("div","meta"); const s=streak(mine,h.id);
    meta.append(weekDots(mine,h.id), el("span","streak", s?`🔥 ${s}일 연속`:"연속 기록 없음"));
    mid.append(el("div","hname",`${h.emoji} ${h.name}`), meta);
    const del=el("button","del"+(armed===h.id?" armed":""), armed===h.id?"정말 삭제":"삭제");
    del.onclick=()=>{ if(armed===h.id) removeHabit(h.id); else{ armed=h.id; render(); setTimeout(()=>{ if(armed===h.id){armed=null;render();} },3000); } };
    row.append(b,mid,del); list.append(row);
  }

  const others = Object.entries(members).filter(([id])=>id!==me);
  $("#fcount").textContent = others.length ? `${others.length}명` : "";
  const box=$("#friends"); box.replaceChildren();
  if(!others.length) box.append(el("div","notice","아직 친구가 없어요. 이 사이트 주소를 친구들에게 알려 주세요."));
  const ranked = others.map(([id,m])=>{ const hs=habitsOf(m); const d=hs.filter(h=>doneOn(m,k).includes(h.id)).length; return {m,hs,d,r:hs.length?d/hs.length:0}; })
                       .sort((a,b)=>b.r-a.r);
  for(const {m,hs,d,r} of ranked){
    const c=el("div","fcard"), head=el("div","fhead");
    const av=el("span","av",(m.name||"?").slice(0,1)); av.style.background=colorOf(m);
    head.append(av, el("div","who",m.name||"이름 없음"),
      el("div","prog"+(hs.length&&r===1?" full":""), !hs.length?"습관 없음":r===1?"전부 완료 ✓":`${d} / ${hs.length}`));
    const bar=el("div","bar"), fill=el("i"); fill.style.width=(r*100)+"%"; bar.append(fill);
    c.append(head,bar);
    if(hs.length){
      const fl=el("div","flist"), hdr=el("div","fitem"); hdr.append(el("span"),el("span"),weekHead()); fl.append(hdr);
      for(const h of hs){
        const it=el("div","fitem"+(doneOn(m,k).includes(h.id)?" done":""));
        const n=el("span","fn",h.name); n.style.overflowWrap="anywhere";
        it.append(el("span",null,h.emoji), n, weekDots(m,h.id)); fl.append(it);
      }
      c.append(fl);
    }
    box.append(c);
  }
}

// 자정이 지나면 '오늘' 갱신
let lastToday = todayKey();
setInterval(()=>{ const t=todayKey(); if(t!==lastToday){ const wasToday = key(sel)===lastToday; lastToday=t; if(wasToday){ sel=new Date(); sel.setHours(0,0,0,0); } if(!$("#v-main").hidden) render(); } }, 60000);

/* ---------- 시작 ---------- */
if(ls.get("ht.room")==="ok") enterRoom();
else { show("v-gate"); renderGate(); }
</script>
